<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>stacks</title>
  <meta name="description" content="Listen to your stacks audiobook library from your phone." />

  <!-- iOS "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="stacks" />
  <meta name="theme-color" content="#14151a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Connectivity banner: shown whenever a request fails to reach the server at all -->
    <div id="offline-banner" class="offline-banner" role="alert" hidden>
      <span>Can&rsquo;t reach stacks. Check that your PC is on and you&rsquo;re on the same network (or connected via Tailscale).</span>
      <button id="offline-retry" type="button" class="offline-retry">Retry</button>
    </div>

    <!-- Initial load -->
    <section id="screen-loading" class="screen screen-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading stacks&hellip;</p>
    </section>

    <!-- PIN entry -->
    <section id="screen-pin" class="screen screen-pin" hidden aria-labelledby="pin-heading">
      <div class="pin-card">
        <div class="pin-brand">
          <img src="icons/icon.svg" alt="" class="pin-logo" width="56" height="56" />
          <h1 id="pin-heading">stacks</h1>
          <p class="pin-sub">Enter the code shown in Settings on your computer.</p>
        </div>

        <form id="pin-form" class="pin-form" autocomplete="off">
          <label for="pin-input" class="sr-only">Sign-in code</label>
          <input
            id="pin-input"
            name="pin"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="one-time-code"
            maxlength="6"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"
            class="pin-input"
            aria-describedby="pin-error"
          />
          <button type="submit" id="pin-submit" class="btn btn-primary pin-submit">Unlock</button>
        </form>

        <p id="pin-error" class="pin-error" role="alert" aria-live="polite" hidden></p>
      </div>
    </section>

    <!-- Library -->
    <section id="screen-library" class="screen screen-library" hidden aria-labelledby="library-heading">
      <header class="library-header">
        <h1 id="library-heading">stacks</h1>
        <button id="btn-refresh-library" type="button" class="icon-btn" aria-label="Refresh library">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.6" /><path d="M20 5v6h-6" /></svg>
        </button>
      </header>

      <div class="library-search-row">
        <label for="library-search" class="sr-only">Search your library</label>
        <input id="library-search" type="search" placeholder="Search title or author&hellip;" class="library-search" />
      </div>

      <div id="genre-filter-row" class="genre-filter-row" hidden></div>

      <div id="continue-listening-row" class="continue-row" hidden>
        <h2 class="section-title">Continue listening</h2>
        <div id="continue-listening-list" class="continue-list"></div>
      </div>

      <h2 class="section-title" id="all-books-title">All books</h2>
      <div id="library-grid" class="library-grid"></div>

      <p id="library-empty" class="library-empty" hidden></p>
    </section>

    <!-- Player -->
    <section id="screen-player" class="screen screen-player" hidden aria-labelledby="player-book-title">
      <header class="player-header">
        <button id="btn-player-back" type="button" class="icon-btn" aria-label="Back to library">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <span class="player-header-label">Now playing</span>
        <button id="btn-player-chapters" type="button" class="icon-btn" aria-label="Chapters" aria-expanded="false" aria-controls="chapters-panel">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6h11M8.5 12h11M8.5 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></svg>
        </button>
      </header>

      <div class="player-cover-wrap">
        <img id="player-cover-img" class="player-cover" alt="" hidden />
        <div id="player-cover-fallback" class="player-cover player-cover-fallback" aria-hidden="true"></div>
      </div>

      <div class="player-meta">
        <h2 id="player-book-title" class="player-title"></h2>
        <p id="player-book-author" class="player-author"></p>
        <p id="player-file-label" class="player-file-label"></p>
      </div>

      <div class="player-seek">
        <label for="seek-bar" class="sr-only">Seek</label>
        <input id="seek-bar" type="range" min="0" max="1000" value="0" step="1" class="seek-bar" />
        <div class="player-time-row">
          <span id="time-elapsed">0:00</span>
          <span id="time-remaining">&minus;0:00</span>
        </div>
      </div>

      <div class="player-transport">
        <button id="btn-back-30" type="button" class="icon-btn transport-btn" aria-label="Back 30 seconds">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="none"><path d="M12.5 5.5v13L2.5 12z" /></svg>
          <span class="transport-badge">30</span>
        </button>
        <button id="btn-play-pause" type="button" class="play-btn" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" stroke="none"><path d="M7 4.5v15l13-7.5z" /></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" stroke="none" hidden><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
        </button>
        <button id="btn-fwd-30" type="button" class="icon-btn transport-btn" aria-label="Forward 30 seconds">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="none"><path d="M11.5 5.5v13l10-6.5z" /></svg>
          <span class="transport-badge">30</span>
        </button>
      </div>

      <div class="player-extra-row">
        <button id="btn-speed" type="button" class="pill-btn" aria-haspopup="true" aria-expanded="false" aria-controls="speed-panel">1&times;</button>
        <button id="btn-sleep" type="button" class="pill-btn" aria-haspopup="true" aria-expanded="false" aria-controls="sleep-panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>
          <span id="sleep-label">Sleep</span>
        </button>
      </div>

      <!-- Chapters bottom sheet -->
      <div id="chapters-panel" class="sheet" hidden>
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Chapters">
          <div class="sheet-handle"></div>
          <h3 class="sheet-title">Chapters</h3>
          <ul id="chapters-list" class="chapters-list"></ul>
        </div>
      </div>

      <!-- Speed bottom sheet -->
      <div id="speed-panel" class="sheet" hidden>
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Playback speed">
          <div class="sheet-handle"></div>
          <h3 class="sheet-title">Playback speed</h3>
          <div id="speed-options" class="option-grid"></div>
        </div>
      </div>

      <!-- Sleep timer bottom sheet -->
      <div id="sleep-panel" class="sheet" hidden>
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Sleep timer">
          <div class="sheet-handle"></div>
          <h3 class="sheet-title">Sleep timer</h3>
          <div id="sleep-options" class="option-grid"></div>
        </div>
      </div>
    </section>

  </div>

  <audio id="audio" playsinline preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
